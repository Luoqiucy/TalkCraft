name: Release

# Pushing a tag such as v0.2.0 publishes a GitHub Release whose notes are the
# matching CHANGELOG.md section. Repository watchers get GitHub's release
# notification (web, e-mail and mobile app, per their notification settings).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tag, version fields and changelog agree
        run: node scripts/release-version.mjs check "$GITHUB_REF_NAME"
      - name: Tests
        run: |
          npm run check
          npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-version.mjs notes "$version" > release-notes.md
          # Before 1.0.0 every release is a development build.
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "TalkCraft $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag $prerelease
