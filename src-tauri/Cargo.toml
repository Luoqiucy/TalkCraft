[package]
name = "wireless-ai-mic"
version = "0.3.0"
edition = "2021"
autobins = false
default-run = "talkcraft-desktop"

[workspace]
members = ["keyboard-hook"]
resolver = "2"

[[bin]]
name = "talkcraft-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Graphics_Gdi"] }

# Relocatable Mac development builds keep devUrl and skip debug symbol bulk.
[profile.mac-dev]
inherits = "dev"
debug = 0
incremental = false
strip = "debuginfo"
